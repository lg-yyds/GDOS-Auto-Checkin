name: Railgun Daily Checkin

on:
  schedule:
    - cron: '18 9,12 * * *'   # 北京时间约 17:18 和 20:18
  workflow_dispatch:          # 支持手动触发

jobs:
  checkin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install requests
      - name: Run checkin
        env:
          COOKIES: ${{ secrets.COOKIES }}
          # 可选推送
          SENDKEY: ${{ secrets.SENDKEY }}                 # PushDeer
          SERVERCHAN_KEY: ${{ secrets.SERVERCHAN_KEY }}   # Server酱
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          EXCHANGE_PLAN: ${{ secrets.EXCHANGE_PLAN }}     # plan100 / plan200 / plan500
        run: python checkin.py

  keepalive:
    name: 每月空提交保活
    if: github.event_name == 'schedule' && github.event.schedule == '0 0 1 * *'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: glados-keepalive
      cancel-in-progress: false

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: 创建空提交并推送
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit --allow-empty -m "chore: keepalive to prevent workflow suspension"
          git push
